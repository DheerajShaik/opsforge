name: Incident Snapshot

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile
        run: python3 -m py_compile incidentsnapshot/incidentsnapshot.py
      - name: Test
        run: python3 -m unittest discover -s incidentsnapshot/tests -v
      - name: Smoke
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python3 incidentsnapshot/incidentsnapshot.py > /tmp/incidentsnapshot.out 2> /tmp/incidentsnapshot.err
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            cat /tmp/incidentsnapshot.err
            exit "$status"
          fi
          grep -Fxq "Incident Snapshot" <(head -n 1 /tmp/incidentsnapshot.out)
          if [ "$status" -eq 0 ]; then
            test ! -s /tmp/incidentsnapshot.err
          else
            grep -Fxq "incidentsnapshot: snapshot incomplete; see Collection warnings" /tmp/incidentsnapshot.err
          fi
          PYTHONPATH=. python3 incidentsnapshot/incidentsnapshot.py --help > /tmp/incidentsnapshot.help
          grep -Fq "Capture bounded, low-sensitivity local Linux incident context." /tmp/incidentsnapshot.help
