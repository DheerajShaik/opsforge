[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opsforge"
version = "0.2.0b1"
description = "Focused, diagnostic-first Linux utilities for DevOps and SRE workflows"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["devops", "diagnostics", "linux", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DheerajShaik/opsforge"
Changelog = "https://github.com/DheerajShaik/opsforge/blob/main/CHANGELOG.md"
Issues = "https://github.com/DheerajShaik/opsforge/issues"
Repository = "https://github.com/DheerajShaik/opsforge.git"

[project.scripts]
portlens = "opsforge.portlens.portlens:main"
diskhound = "opsforge.diskhound.diskhound:main"
certwatch = "opsforge.certwatch.certwatch:main"
svcdoctor = "opsforge.svcdoctor.svcdoctor:main"
loghound = "opsforge.loghound.loghound:main"
procwatch = "opsforge.procwatch.procwatch:main"
configdiff = "opsforge.configdiff.configdiff:main"
netdoctor = "opsforge.netdoctor.netdoctor:main"
healthctl = "opsforge.healthctl.healthctl:main"
incident-snapshot = "opsforge.incidentsnapshot.incidentsnapshot:main"

[tool.setuptools]
packages = [
  "opsforge",
  "opsforge.common",
  "opsforge.certwatch",
  "opsforge.configdiff",
  "opsforge.diskhound",
  "opsforge.healthctl",
  "opsforge.incidentsnapshot",
  "opsforge.loghound",
  "opsforge.netdoctor",
  "opsforge.portlens",
  "opsforge.procwatch",
  "opsforge.svcdoctor",
]

# MANIFEST.in adds tests to the sdist; include-package-data would otherwise copy them into the wheel.
[tool.setuptools.exclude-package-data]
"*" = ["tests/*"]
