name: SvcDoctor

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile
        run: python3 -m py_compile svcdoctor/svcdoctor.py
      - name: Test
        run: python3 -m unittest discover -s svcdoctor/tests -v
